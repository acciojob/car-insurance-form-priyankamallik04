<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <form method="POST">
      	   <fieldset>
      	   	    <legend>Car Insurance Registraion</legend>

      	   	    <label for="name">Name: </label>
      	   	    <input type="text" name="name" id="name" required/>
      	   	    <br/>
      	   	    <br/>

                <label for="email">Email: </label>
      	   	    <input type="email" name="email" id="email" required/>
      	   	    <br/>
      	   	    <br/>
               
                 <label for="gender">Gender: </label>
                 <input type="radio" name="gender" value="m" required />Male
                 <input type="radio" name="gender" value="f" required/>Female
                 <input type="radio" name="gender" value="o" required />Others
                <br/>
      	   	    <br/>

      	   	    <label for="cars">Car Brands: </label>
      	   	    <select id="cars">
      	   	    	  <option>------Select your Car------</option>
      	   	    	  <option>BMW</option>
      	   	    	  <option>Audi</option>
      	   	    	  <option>Mercedez</option>
      	   	    </select>
                 <br/>
      	   	     <br/>

      	   	     <label for="carage">Car Age: </label>
      	   	     <input type="number" name="carage" id="carage" required/>
      	   	     <br/>
      	   	     <br/>

      	   	      <label for="dop">Date of Purchase: </label> 
      	   	      <input type="date" name="date" id="dop" required/>
      	   	      <br/>
      	   	      <br/>

      	   	      <label for="password">Password: </label>
      	   	      <input type="password" name="password" id="password" required />
                   <br/>
      	   	       <br/>

      	   	       
      	   	       <button type="submit" name="submit" value="Submit"/> Submit</button>

                    <br/>
      	   	        <br/>
      	   </fieldset>

      </form>
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
